<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 15px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Điện thoại iPhone 15 Pro</td>
                <td>28.990.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>35.500.000 VNĐ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Tai nghe AirPods Pro 2</td>
                <td>5.990.000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Đồng hồ Apple Watch Series 9</td>
                <td>10.490.000 VNĐ</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
