<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
        }

        .form-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .gender-group label {
            font-weight: normal;
            cursor: pointer;
            margin-bottom: 0;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Đăng Ký Người Dùng</h2>

        <!-- Form gửi dữ liệu qua phương thức POST lên endpoint chỉ định -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Họ và tên (name="name") -->
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên" required>
            </div>

            <!-- Email (name="email") -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required>
            </div>

            <!-- Số điện thoại (name="phone") -->
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <!-- Giới tính (name="gender") -->
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="nu"> Nữ</label>
                </div>
            </div>

            <!-- Nút Đăng ký -->
            <button type="submit" class="btn-submit">Đăng ký</button>

        </form>
    </div>

</body>
</html>
