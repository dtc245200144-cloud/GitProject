<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Khảo Sát & Đăng Ký Học Viên</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1a73e8;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        h2:first-of-type {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .inline-group label {
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        input[type="reset"] {
            background-color: #6c757d;
            color: white;
        }

        input[type="reset"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= PHẦN 1 ================= -->
        <form method="post" action="#">
            <h2>Phần 1: Form Khảo Sát Sở Thích</h2>
            
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email_p1">Email:</label>
                <input type="email" id="email_p1" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="hobby" value="Thể thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="Âm nhạc"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="Du lịch"> Du lịch</label>
                </div>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>

        <hr style="margin: 40px 0; border: none; border-top: 1px dashed #ccc;">

        <!-- ================= PHẦN 2 ================= -->
        <form method="post" action="#">
            <h2>Phần 2: Form Đăng Ký Học Viên</h2>

            <!-- Họ và tên -->
            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ tên..." required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <!-- Giới tính -->
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="inline-group">
                    <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                    <label><input type="radio" name="gender" value="Khác"> Khác</label>
                </div>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" placeholder="Nhập địa chỉ cư trú..."></textarea>
            </div>

            <!-- Khóa học -->
            <div class="form-group">
                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="HTML & CSS">HTML & CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <!-- Hình thức học -->
            <div class="form-group">
                <label>Hình thức học:</label>
                <div class="inline-group">
                    <label><input type="radio" name="study_type" value="Online" checked> Online</label>
                    <label><input type="radio" name="study_type" value="Offline"> Offline</label>
                </div>
            </div>

            <!-- Sở thích -->
            <div class="form-group">
                <label>Sở thích:</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="hobby" value="Lập trình"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="Chơi game"> Chơi game</label>
                    <label><input type="checkbox" name="hobby" value="Thể thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label>
                </div>
            </div>

            <!-- Ghi chú -->
            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" placeholder="Nhập ghi chú bổ sung..."></textarea>
            </div>

            <!-- Nút bấm -->
            <div class="btn-group">
                <input type="submit" value="Đăng ký">
                <input type="reset" value="Nhập lại">
            </div>
        </form>

    </div>

</body>
</html>
