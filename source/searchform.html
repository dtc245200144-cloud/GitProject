<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm</title>
</head>
<body>

    <h2>Tìm kiếm thông tin</h2>

    <!-- Form tìm kiếm kết nối với Google -->
    <form action="https://www.google.com.vn/search" method="GET"> 
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm..."/>
        <input type="submit" value="Tìm kiếm"/>
    </form>

</body>
</html>
