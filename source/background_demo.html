<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành Background CSS</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style_background.css">
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn mô tả -->
    <p class="description">
        Trang web này được thiết kế để luyện tập thuộc tính màu nền (background-color) và ảnh nền (background-image) trong CSS.
    </p>

    <!-- Khối div chứa nội dung quan trọng có ảnh nền -->
    <div class="banner-box">
        <h2>Nội Dung Quan Trọng</h2>
        <p>Đây là khối nội dung nổi bật với ảnh nền được căn giữa và làm mờ đẹp mắt.</p>
    </div>

</body>
</html>
