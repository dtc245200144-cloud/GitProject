<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành Bộ Chọn CSS</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style_selectors.css">
</head>
<body>

    <div class="card-container">
        <!-- Element selector + Grouping selector -->
        <h1 id="main-title">Trang web của tôi</h1>

        <!-- Element selector + Class selector -->
        <p class="bio-text">
            Xin chào! Tôi là học viên lập trình web. Tôi đang luyện tập sử dụng các loại bộ chọn CSS để tạo giao diện đẹp mắt và linh hoạt hơn.
        </p>

        <!-- Element selector + Class & ID selector -->
        <h2>Sở thích của tôi</h2>
        <ul class="hobby-list">
            <li id="hobby-1">Đọc sách và tìm hiểu công nghệ</li>
            <li id="hobby-2">Chơi bóng đá và thể thao</li>
            <li id="hobby-3">Nghe nhạc và du lịch</li>
        </ul>

        <!-- Pseudo-class selector :hover -->
        <button id="btn-action" class="btn">Nhấn vào đây</button>
    </div>

</body>
</html>
